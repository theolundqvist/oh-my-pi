# Keeps theolundqvist/oh-my-pi = upstream main + the fix branches listed in
# .github/fork/fixes, and publishes vX.Y.Z-theo.N binaries built from the
# latest upstream release tag plus those fixes.
#
# main moves only after the merge passes coding-agent's checks, and never by
# force. A conflict or a red check fails the run and opens (or updates) one
# "Fork sync is failing" issue; the next green run closes it.
#
# Secret FORK_SYNC_DEPLOY_KEY: private half of a write deploy key on this repo.
# GITHUB_TOKEN cannot push merges that touch .github/workflows, and upstream
# edits ci.yml regularly. Only the two push jobs see the key; jobs that execute
# repository code (bun install, tests, builds) never do. Upstream's own
# workflows (ci, nix, bazel-cache-warm) are disabled in the fork's Actions
# settings: they target upstream's self-hosted runners and npm.
name: Fork sync

on:
   schedule:
      - cron: "23 */6 * * *"
   workflow_dispatch:
      inputs:
         force_release:
            description: Publish a release even if the latest one already ships the same tree
            type: boolean
            default: false

concurrency:
   group: fork-sync
   cancel-in-progress: false

permissions:
   contents: read

env:
   UPSTREAM_REPO: can1357/oh-my-pi

jobs:
   merge:
      name: Merge upstream and fixes
      runs-on: ubuntu-24.04
      outputs:
         changed: ${{ steps.sync.outputs.changed }}
         report: ${{ steps.sync.outputs.report }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
              fetch-depth: 0
              persist-credentials: false
         - id: sync
           env:
              GH_TOKEN: ${{ github.token }}
           run: bash .github/fork/sync.sh
         - if: steps.sync.outputs.changed == 'true'
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: candidate
              path: ${{ runner.temp }}/candidate.bundle
              retention-days: 3

   check:
      name: "Check: ${{ matrix.name }}"
      needs: merge
      if: needs.merge.outputs.changed == 'true'
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      strategy:
         fail-fast: false
         matrix:
            include:
               - { name: check:ts, run: bun run check:ts }
               - { name: smoke, run: bun run ci:test:smoke }
               - { name: coding-agent runtime, run: bun run ci:test:coding-agent:runtime, concurrency: "4" }
               - { name: coding-agent singleton, run: bun run ci:test:coding-agent:singleton }
               - { name: coding-agent ui, run: bun run ci:test:coding-agent:ui, concurrency: "2" }
               - { name: coding-agent native 1/3, run: bun run ci:test:coding-agent:native, concurrency: "4", shard: 1/3 }
               - { name: coding-agent native 2/3, run: bun run ci:test:coding-agent:native, concurrency: "4", shard: 2/3 }
               - { name: coding-agent native 3/3, run: bun run ci:test:coding-agent:native, concurrency: "4", shard: 3/3 }
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
              fetch-depth: 0
              persist-credentials: false
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: candidate
              path: ${{ runner.temp }}
         - name: Check out the candidate
           run: |
              git fetch --quiet "$RUNNER_TEMP/candidate.bundle" HEAD
              git checkout --quiet --detach FETCH_HEAD
         - uses: ./.github/actions/bun-install
         - run: bash .github/fork/install-natives.sh linux-x64 --allow-latest
         - name: ${{ matrix.name }}
           env:
              OMP_TEST_CONCURRENCY: ${{ matrix.concurrency }}
              OMP_TEST_SHARD: ${{ matrix.shard }}
           run: ${{ matrix.run }}

   publish:
      name: Push fork main
      needs: [merge, check]
      if: needs.merge.outputs.changed == 'true' && needs.check.result == 'success'
      runs-on: ubuntu-24.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
              fetch-depth: 0
              ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: candidate
              path: ${{ runner.temp }}
         # A plain push: it is rejected, never forced, if main moved since the merge.
         - run: |
              git fetch --quiet "$RUNNER_TEMP/candidate.bundle" HEAD
              git push origin FETCH_HEAD:refs/heads/main

   release-plan:
      name: Plan release
      needs: [merge, publish]
      if: ${{ !cancelled() }}
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      outputs:
         base: ${{ steps.tree.outputs.base }}
         tag: ${{ steps.tree.outputs.tag }}
         commit: ${{ steps.tree.outputs.commit }}
         report: ${{ steps.tree.outputs.report }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
              fetch-depth: 0
              persist-credentials: false
         - name: Copy the fork scripts out of main
           run: cp -r .github/fork "$RUNNER_TEMP/fork"
         - id: tree
           env:
              GH_TOKEN: ${{ github.token }}
              FORCE_RELEASE: ${{ inputs.force_release }}
           run: bash "$RUNNER_TEMP/fork/release-tree.sh"
         - if: steps.tree.outputs.tag != ''
           uses: ./.github/actions/bun-install
         - if: steps.tree.outputs.tag != ''
           run: bash "$RUNNER_TEMP/fork/install-natives.sh" linux-x64
         - name: Check the release tree
           if: steps.tree.outputs.tag != ''
           env:
              BASE: ${{ steps.tree.outputs.base }}
           run: |
              cd packages/coding-agent
              bun run check:types
              tests=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'test/*.test.ts' | sed 's|^packages/coding-agent/||')
              if [ -n "$tests" ]; then bun test $tests; fi
         - if: steps.tree.outputs.tag != ''
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: release-tree
              path: |
                 ${{ runner.temp }}/release.bundle
                 ${{ runner.temp }}/release-notes.md
              retention-days: 7

   release-build:
      name: "Release binary: ${{ matrix.target }}"
      needs: release-plan
      if: needs.release-plan.outputs.tag != ''
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      strategy:
         fail-fast: false
         matrix:
            include:
               - { target: linux-x64, os: ubuntu-22.04 }
               - { target: darwin-arm64, os: macos-15 }
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
              fetch-depth: 0
              persist-credentials: false
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: release-tree
              path: ${{ runner.temp }}
         - name: Check out the release tree
           env:
              BASE: ${{ needs.release-plan.outputs.base }}
              COMMIT: ${{ needs.release-plan.outputs.commit }}
           run: |
              cp -r .github/fork "$RUNNER_TEMP/fork"
              git fetch --quiet --no-tags "https://github.com/$UPSTREAM_REPO.git" "+refs/tags/$BASE:refs/tags/$BASE"
              if [ -f "$RUNNER_TEMP/release.bundle" ]; then git fetch --quiet "$RUNNER_TEMP/release.bundle" HEAD; fi
              git checkout --quiet --detach "$COMMIT"
         - uses: ./.github/actions/bun-install
         - run: bash "$RUNNER_TEMP/fork/install-natives.sh" ${{ matrix.target }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target }}
           run: bun run ci:release:build-binaries
         - name: Smoke release binary
           run: |
              binary=packages/coding-agent/binaries/omp-${{ matrix.target }}
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$binary" --smoke-test
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-${{ matrix.target }}
              path: packages/coding-agent/binaries/omp-${{ matrix.target }}
              if-no-files-found: error

   release-publish:
      name: Publish release
      needs: [release-plan, release-build]
      if: needs.release-plan.outputs.tag != '' && needs.release-build.result == 'success'
      runs-on: ubuntu-24.04
      permissions:
         contents: write
      env:
         TAG: ${{ needs.release-plan.outputs.tag }}
         BASE: ${{ needs.release-plan.outputs.base }}
         COMMIT: ${{ needs.release-plan.outputs.commit }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: main
              fetch-depth: 0
              ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              path: ${{ runner.temp }}/artifacts
         - name: Push the release tag
           run: |
              git fetch --quiet --no-tags "https://github.com/$UPSTREAM_REPO.git" "+refs/tags/$BASE:refs/tags/$BASE"
              bundle="$RUNNER_TEMP/artifacts/release-tree/release.bundle"
              if [ -f "$bundle" ]; then git fetch --quiet "$bundle" HEAD; fi
              git tag "$TAG" "$COMMIT"
              git push origin "refs/tags/$TAG"
         - name: Create the GitHub release
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              chmod +x "$RUNNER_TEMP"/artifacts/omp-*/omp-*
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
                 --title "$TAG" --notes-file "$RUNNER_TEMP/artifacts/release-tree/release-notes.md" \
                 "$RUNNER_TEMP/artifacts/omp-linux-x64/omp-linux-x64" \
                 "$RUNNER_TEMP/artifacts/omp-darwin-arm64/omp-darwin-arm64"

   report:
      name: Report
      needs: [merge, check, publish, release-plan, release-build, release-publish]
      if: ${{ always() }}
      runs-on: ubuntu-24.04
      permissions:
         issues: write
      env:
         GH_TOKEN: ${{ github.token }}
         RESULTS: ${{ toJSON(needs) }}
         RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
         TITLE: Fork sync is failing
      steps:
         - run: |
              failed=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$RESULTS" | paste -sd, -)
              reasons=$(jq -r '[.[].outputs.report // empty | select(. != "")] | join("\n")' <<<"$RESULTS")
              issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
              if [ -n "$failed" ]; then
                body=$(printf 'Run %s failed in: %s\n\n%s\n\nfork main was not pushed. Resolve the conflict or failure on a fix branch (or in .github/fork/fixes), then re-run the "Fork sync" workflow.\n' "$RUN_URL" "$failed" "$reasons")
                if [ -n "$issue" ]; then
                  gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
                else
                  gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
                fi
                exit 1
              fi
              if [ -n "$issue" ]; then
                gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Run $RUN_URL is green again."
              fi
